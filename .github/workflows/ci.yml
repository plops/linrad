name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  linux-build:
    name: Linux Build (Ubuntu 26.04)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential nasm libx11-dev libxext-dev libasound2-dev cmake

      - name: Configure and build xlinrad64
        run: |
          ./configure
          make xlinrad64

      - name: Run verification test suite
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh

      - name: Stage Linux binary artifacts
        run: |
          mkdir -p dist
          cp xlinrad64 dist/
          cp errors.lir help.lir dist/
          if [ -f build/clinrad ]; then cp build/clinrad dist/; fi
          cd dist && sha256sum * > checksums-sha256-linux.txt

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linrad-linux-x86_64
          path: dist/

      - name: Release Linux binary
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/xlinrad64
            dist/checksums-sha256-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows cross-compile
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update -qq && sudo apt install -y gcc-mingw-w64 nasm

      - name: Setup API 3.15
        run: |
          cp Makefile.msys2.nodebug Makefile
          sed -i 's/^\(#define SDRPLAY3PAR_VERNR 3[0-9][0-9]\)/\/\/\1/; s/^\/\/\(#define SDRPLAY3PAR_VERNR 315\)/\1/' vernr.h

      - name: Build 64 bit - API 3.15
        run: make linrad64.exe && mv linrad64.exe linrad64-API3.15.exe && rm -f *.ox

      - name: Checksums
        run: sha256sum linrad64-API3.15.exe > checksums-sha256.txt

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linrad-windows-x64
          path: |
            linrad64-API3.15.exe
            checksums-sha256.txt

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            linrad64-API3.15.exe
            checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
