name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      debug_ssh:
        description: 'Enable SSH debug session (tmate)'
        type: boolean
        required: false
        default: false

jobs:
  linux-build:
    name: Linux Build (Ubuntu 26.04)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y \
            build-essential \
            nasm \
            cmake \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libasound2-dev \
            portaudio19-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libusb-dev \
            libftdi-dev \
            libftdi1-dev \
            librtlsdr-dev \
            libbladerf-dev \
            libmirisdr-dev \
            libairspy-dev \
            libairspyhf-dev \
            ocl-icd-opencl-dev \
            opencl-headers \
            libclfft-dev

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Run verification test suite
        run: ctest --test-dir build --output-on-failure

      - name: Stage Linux binary artifacts
        run: |
          mkdir -p dist
          cp build/clinrad dist/
          cp errors.lir help.lir dist/
          if [ -f build/xlinrad64 ]; then cp -L build/xlinrad64 dist/ || cp build/clinrad dist/xlinrad64; else cp build/clinrad dist/xlinrad64; fi
          if [ -f build/sim2perseus ]; then cp build/sim2perseus dist/; fi
          cd dist && sha256sum * > checksums-sha256-linux.txt

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linrad-linux-x86_64
          path: dist/

      - name: Release Linux binary
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/xlinrad64
            dist/clinrad
            dist/checksums-sha256-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH debug session (tmate)
        uses: mxschmitt/action-tmate@v3
        if: ${{ always() && inputs.debug_ssh }}

  windows-build:
    name: Windows cross-compile
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update -qq && sudo apt install -y gcc-mingw-w64 nasm

      - name: Setup API 3.15
        run: |
          cp Makefile.msys2.nodebug Makefile
          sed -i 's/^\(#define SDRPLAY3PAR_VERNR 3[0-9][0-9]\)/\/\/\1/; s/^\/\/\(#define SDRPLAY3PAR_VERNR 315\)/\1/' vernr.h

      - name: Build 64 bit - API 3.15
        run: make linrad64.exe && mv linrad64.exe linrad64-API3.15.exe && rm -f *.ox

      - name: Checksums
        run: sha256sum linrad64-API3.15.exe > checksums-sha256.txt

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linrad-windows-x64
          path: |
            linrad64-API3.15.exe
            checksums-sha256.txt

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            linrad64-API3.15.exe
            checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH debug session (tmate)
        uses: mxschmitt/action-tmate@v3
        if: ${{ always() && inputs.debug_ssh }}
